[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-datasketch"
version = "0.1.0"
description = "Mojo kernels for MinHash, HyperLogLog, and LSH"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.10"]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
